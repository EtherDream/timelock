<script>
function fillRandomBytes(buf) {
  for (let i = 0; i < buf.length; i += 65536) {
    const slice = buf.subarray(i, i + 65536)
    crypto.getRandomValues(slice)
  }
}

async function main() {
  const payload = new Uint8Array(1024 * 1024 * 64)
  // fillRandomBytes(payload)

  // const payload = new Uint8Array(1024)
  let buf

  //
  // HKDF
  //
  {
    console.time('hkdf-init')
    const k = await crypto.subtle.importKey(
      'raw', payload, 'HKDF', false, ['deriveBits']
    )
    console.timeEnd('hkdf-init')

    const opt = {
      name: 'HKDF',
      hash: 'SHA-512',
      salt: new Uint8Array(0),
      info: new Uint8Array(0),
    }
    for (let i = 0; i < 10; i++) {
      console.time('hkdf')
      buf = await crypto.subtle.deriveBits(opt, k, 512)
      console.timeEnd('hkdf')
    }
    console.log('hkdf:', new Uint8Array(buf).subarray(0, 10))
  }

  //
  // PBKDF2
  //
  {
    console.time('pbkdf2-init')
    const k = await crypto.subtle.importKey(
      'raw', payload, 'PBKDF2', false, ['deriveBits']
    )
    console.timeEnd('pbkdf2-init')

    const opt = {
      name: 'PBKDF2',
      hash: 'SHA-512',
      iterations: 1,
    }
    for (let i = 0; i < 10; i++) {
      opt.salt = Uint8Array.of(i)

      console.time('pbkdf2')
      const buf = await crypto.subtle.deriveBits(opt, k, 512)
      console.timeEnd('pbkdf2')

      // console.log('pbkdf2:', i, new Uint8Array(buf).subarray(0, 10).join(' '))
    }
  }
  //
  // HMAC
  //
  {
    console.time('hmac-init')

    const k = await crypto.subtle.importKey('raw', payload, {
      name: 'HMAC',
      hash: {name: 'SHA-512'}
    }, false, ['sign'])
    console.timeEnd('hmac-init')

    for (let i = 0; i < 10; i++) {
      console.time('hmac')
      buf = await crypto.subtle.sign('HMAC', k, Uint8Array.of(0))
      console.timeEnd('hmac')
    }
    console.log('hmac:', new Uint8Array(buf))
  }
  //
  // Hash
  //
  {
    for (let i = 0; i < 10; i++) {
      console.time('sha')
      buf = await crypto.subtle.digest('SHA-512', payload)
      console.timeEnd('sha')
    }
    console.log('sha:', new Uint8Array(buf))
  }
  //
  // AES
  //
  {
    const iv = new Uint8Array(16)
    const aesKey = await crypto.subtle.importKey('raw', new Uint8Array(16), 'AES-CBC', false, ['encrypt'])

    for (let i = 0; i < 10; i++) {
      console.time('aes')
      buf = await crypto.subtle.encrypt({name: 'AES-CBC', iv}, aesKey, payload)
      console.timeEnd('aes')
    }
    console.log('aes:', new Uint8Array(buf).subarray(0, 10))
  }
}

main()
</script>
