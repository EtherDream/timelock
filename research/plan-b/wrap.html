<script>
async function main() {
  // const payload = new Uint8Array(1024 * 1024 * 64)

  const k = await crypto.subtle.importKey(
    'raw', new Uint8Array(16), 'PBKDF2', false, [
      // 'encrypt',
      // 'decrypt',
      // 'sign',
      // 'verify',
      'deriveKey',
      'deriveBits',
      // 'wrapKey',
      // 'unwrapKey',
    ]
  )
  const opt = {
    name: 'PBKDF2',
    hash: 'SHA-256',
    salt: new Uint8Array(0),
    iterations: 1,
  }
  // const buf = await crypto.subtle.deriveBits(opt, k, 8 * 1024 * 1024 * 64)
  // console.log(new Uint8Array(buf).length)

  console.time('deriveKey')
  const k2 = await crypto.subtle.deriveKey(opt, k,
    {
      name: 'HMAC',
      hash: 'SHA-256',
      length: 8 * 1024 * 1024 * 64,
    },
    true,
    ['sign']
  )
  console.timeEnd('deriveKey')

  console.time('sign')
  const buf = await crypto.subtle.sign('HMAC', k2, new Uint8Array(0))
  console.timeEnd('sign')

  console.log(new Uint8Array(buf))

  // const k = await crypto.subtle.importKey(
  //   'raw', payload, 'PBKDF2', false, ['wrapKey']
  // )
}
main()
</script>
